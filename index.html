<style>
/* Layout: app de uma tela, coluna única de até 480px, barra de abas embaixo. Dark-first, vinho e champanhe. */
:root {
  --bg: #150d11;
  --surface: #21151a;
  --surface-2: #2c1c23;
  --line: #3e2931;
  --fg: #f4ebe7;
  --muted: #b39ca4;
  --accent: #c2304f;
  --accent-soft: #c2304f26;
  --accent-fg: #fff6f7;
  --gold: #d8b06a;
  --triplo: #f5c518;
  --prata: linear-gradient(160deg, #f4f2f1 0%, #c4bfbc 55%, #e6e2df 100%);
  --prata-cor: #b7b1ae;
  --prata-fg: #2a2322;
  --triplo-fg: #2a1d00;
  --ok: #4cb782;
  --bad: #e2596f;
  --shadow: 0 18px 40px #00000066;
  --f-display: "Sora", "Avenir Next", -apple-system, "Segoe UI", sans-serif;
  --f-body: "Figtree", -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6efec; --surface: #fffaf8; --surface-2: #f1e5e1; --line: #e2d0cb;
    --fg: #2a1219; --muted: #7a5c65; --accent: #9e1f3e; --accent-soft: #9e1f3e1a; --accent-fg: #ffffff;
    --gold: #8f6520; --triplo: #e0a800; --triplo-fg: #2a1d00; --prata: linear-gradient(160deg, #efedec 0%, #b9b3b0 55%, #dcd8d5 100%); --prata-cor: #a9a3a0; --prata-fg: #2a2322; --ok: #1f8a55; --bad: #c23a52; --shadow: 0 14px 30px #4a1a2a22;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f6efec; --surface: #fffaf8; --surface-2: #f1e5e1; --line: #e2d0cb;
  --fg: #2a1219; --muted: #7a5c65; --accent: #9e1f3e; --accent-soft: #9e1f3e1a; --accent-fg: #ffffff;
  --gold: #8f6520; --triplo: #e0a800; --triplo-fg: #2a1d00; --prata: linear-gradient(160deg, #efedec 0%, #b9b3b0 55%, #dcd8d5 100%); --prata-cor: #a9a3a0; --prata-fg: #2a2322; --ok: #1f8a55; --bad: #c23a52; --shadow: 0 14px 30px #4a1a2a22;
  color-scheme: light;
}

html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.app { max-width: 480px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; }
.topo { display: flex; align-items: center; justify-content: space-between; padding-block: 12px 8px; }
.logo { font-family: var(--f-display); font-weight: 700; font-size: 28px; line-height: 1; letter-spacing: -0.04em; }
.logo b { color: var(--accent); font-weight: 700; }
.logo { display: flex; align-items: center; gap: 8px; }
.marca { width: 36px; height: 36px; flex: none; overflow: visible; }
.m-cerebro { fill: color-mix(in srgb, var(--accent) 30%, var(--surface-2)); stroke: var(--accent); stroke-width: 1.6; stroke-linejoin: round; }
.m-dobra { fill: none; stroke: var(--accent); stroke-width: 1.3; stroke-linecap: round; opacity: .55; }
.m-coracao { fill: var(--accent); stroke: var(--bg); stroke-width: 1.2; }
.m-mini { fill: var(--gold); }
@keyframes bate { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(1); } 45% { transform: scale(1.12); } }
.m-coracao { transform-origin: 20px 22px; animation: bate 2.4s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .m-coracao { animation: none; } }
.chip-nivel { position: relative; display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.chip-nivel small { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.chip-nivel strong { font-family: var(--f-mono); color: var(--gold); font-size: 15px; }

main { flex: 1; overflow-y: auto; overflow-x: hidden; padding-block: 4px 16px; min-height: 0; }
.abas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding-block: 8px; border-top: 1px solid var(--line); background: var(--bg); }
.aba { background: none; border: 0; padding: 8px 4px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-size: 12px; font-weight: 600; position: relative; }
.aba svg { width: 22px; height: 22px; }
.aba[aria-current="page"] { color: var(--fg); background: var(--surface); }
.aba[aria-current="page"] svg { color: var(--accent); }
.badge { position: absolute; top: 4px; right: calc(50% - 20px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--accent); color: var(--accent-fg); font-size: 10px; display: grid; place-items: center; padding: 0 4px; }

h1, h2 { font-family: var(--f-display); font-weight: 700; letter-spacing: -0.03em; text-wrap: balance; margin: 0; }
h1 { font-size: 30px; line-height: 1.12; }
h2 { font-size: 21px; line-height: 1.2; }
.rotulo { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.pilha { display: flex; flex-direction: column; gap: 16px; }
.linha { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.btn { border: 0; border-radius: 14px; padding: 14px 18px; font-weight: 700; background: var(--accent); color: var(--accent-fg); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:active { transform: scale(0.98); }
.btn.sec { background: var(--surface-2); color: var(--fg); }
.btn.ouro { background: var(--gold); color: #1d1206; }
.btn.triplo { background: var(--triplo); color: var(--triplo-fg); }
.btn.prata { background: var(--prata); color: var(--prata-fg); box-shadow: inset 0 0 0 1px var(--prata-cor), inset 0 1px 0 #ffffffb3; }
.btn.mini { padding: 9px 14px; flex: none; }
.btn.bloco { width: 100%; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 8px; }

.campo { display: flex; flex-direction: column; gap: 6px; }
.campo label { font-size: 13px; font-weight: 600; }
.campo input, .campo textarea, .campo select { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; width: 100%; }
.campo textarea { resize: vertical; min-height: 72px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 6px; font-weight: 600; font-size: 14px; }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--fg); }
.erro { color: var(--bad); font-size: 13px; min-height: 18px; }

/* Nível */
.placar { display: grid; grid-template-columns: auto 1fr; gap: 4px 18px; align-items: end; padding: 18px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); }
.placar .num { font-family: var(--f-mono); font-size: 56px; line-height: 0.9; color: var(--gold); font-weight: 700; grid-row: span 2; font-variant-numeric: tabular-nums; }
.placar p { margin: 0; font-size: 14px; }
.prox { grid-column: 1 / -1; margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.trilho { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.trilho i { display: block; height: 100%; background: var(--gold); border-radius: 3px; }

/* Categorias */
.cats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.cat { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.cat strong { font-size: 14px; line-height: 1.2; }
.cat span { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.cat:active { border-color: var(--accent); }

/* Rodada */
.rodada { display: flex; flex-direction: column; gap: 18px; padding-top: 6px; }
.rodada-topo { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
.rodada-topo .num { font-family: var(--f-mono); color: var(--muted); }
.tempo { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.tempo i { display: block; height: 100%; width: 100%; background: var(--gold); transform-origin: left; }
.tempo.alerta i { background: var(--bad); }
.enunciado { font-family: var(--f-display); font-weight: 600; letter-spacing: -0.02em; font-size: 23px; line-height: 1.25; min-height: 3.5em; text-wrap: balance; }
.opcoes { display: flex; flex-direction: column; gap: 10px; }
.opcao { text-align: left; padding: 16px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); font-size: 16px; font-weight: 600; display: flex; gap: 12px; align-items: center; }
.opcao kbd { font-family: var(--f-mono); font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; }
.opcao.certa { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 16%, var(--surface)); }
.opcao.errada { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--surface)); }
.feedback { text-align: center; font-weight: 700; min-height: 24px; }
.feedback.ok { color: var(--ok); } .feedback.no { color: var(--bad); }
.resultado { text-align: center; padding: 26px 18px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.resultado .grande { font-family: var(--f-mono); font-size: 64px; font-weight: 700; color: var(--gold); line-height: 1; }

/* Perfis */
.avatar { border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); color: #fff; overflow: hidden; flex: none; background-size: cover; background-position: center; }
.cartao { border-radius: 24px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); position: relative; }
.cartao .foto { aspect-ratio: 4 / 4.3; max-width: 100%; display: grid; place-items: center; font-family: var(--f-display); font-size: 120px; color: #ffffffe6; background-size: cover; background-position: center; position: relative; }
.cartao .foto .nivel-tag { position: absolute; top: 14px; left: 14px; padding: 6px 12px; border-radius: 999px; background: #120a0dcc; color: #f4d9a6; font-family: var(--f-mono); font-size: 13px; font-weight: 700; }
.cartao .info { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 6px; }
.cartao .nome { font-family: var(--f-display); font-weight: 700; letter-spacing: -0.03em; font-size: 26px; line-height: 1.1; }
.cartao .nome span { font-family: var(--f-body); font-size: 20px; color: var(--muted); }
.cartao .bio { margin: 4px 0 0; }
.cartao.bloqueado .foto { filter: blur(14px) saturate(0.6); transform: scale(1.08); }
.cadeado { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 24px; background: color-mix(in srgb, var(--bg) 55%, transparent); }
.cadeado .grande { font-family: var(--f-mono); font-size: 40px; color: var(--gold); font-weight: 700; }
.acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }

.lista { display: flex; flex-direction: column; }
.item { display: flex; gap: 12px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; }
.item .txt { min-width: 0; flex: 1; }
.item .txt strong { display: block; }
.item .txt span { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Chat */
.chat { display: flex; flex-direction: column; height: 100%; }
.chat-topo { display: flex; align-items: center; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-block: 14px; min-height: 0; }
.msg { max-width: 78%; padding: 10px 14px; border-radius: 18px; overflow-wrap: anywhere; }
.msg.eu { align-self: flex-end; background: var(--accent); color: var(--accent-fg); border-bottom-right-radius: 6px; }
.msg.ela { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 6px; }
.digitando { color: var(--muted); font-size: 13px; font-style: italic; }
.envio { display: flex; gap: 8px; padding-top: 8px; }
.envio .mic { padding: 0 12px; flex: none; }
.msg.eu[data-i] { cursor: pointer; }
.msg.apagada { font-style: italic; opacity: .7; }
.msg.audio { display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
.msg audio { height: 36px; max-width: 200px; }
.msg .dur { font-size: 12px; opacity: .8; }
.gravando { display: flex; align-items: center; gap: 10px; flex: 1; min-height: 46px; }
.gravando #gravT { flex: 1; font-variant-numeric: tabular-nums; }
.gravando .ponto { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); animation: pisca 1s ease-in-out infinite; }
@keyframes pisca { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .gravando .ponto { animation: none; } }
.opcao-radio { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
.opcao-radio input { accent-color: var(--accent); }
.btn-google { min-height: 44px; display: flex; justify-content: center; }
.btn-apple { background: #000; color: #fff; }
.ou { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.ou::before, .ou::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.envio input { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 12px 16px; }

/* Folha (modal) */
.veu { position: fixed; inset: 0; background: #0a0507b3; display: flex; align-items: flex-end; justify-content: center; z-index: 50; padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.folha { width: 100%; max-width: 480px; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); }
.match-tela { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px; background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--accent) 55%, var(--bg)), var(--bg) 70%); }
.match-tela h1 { font-size: 44px; }
.duo { display: flex; }
.duo .avatar { border: 3px solid var(--bg); }
.duo .avatar + .avatar { margin-left: -18px; }

.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; z-index: 70; white-space: nowrap; }
.vazio { text-align: center; padding: 40px 16px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-family: var(--f-mono); font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.caixa { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.chave { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.toggle { width: 50px; height: 30px; border-radius: 15px; border: 0; background: var(--surface-2); position: relative; flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--muted); transition: transform .2s; }
.toggle[aria-checked="true"] { background: var(--accent); }
.toggle[aria-checked="true"]::after { transform: translateX(20px); background: #fff; }
.aviso { font-size: 12px; color: var(--muted); text-align: center; }

/* Seleção de assuntos */
.cat[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.cat[aria-pressed="true"] span { color: var(--fg); }
.cat.aleatorio { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; border-style: dashed; }
.cat.aleatorio[aria-pressed="true"] { border-style: solid; }
.iniciar { position: sticky; bottom: 0; padding-block: 12px 4px; background: linear-gradient(transparent, var(--bg) 30%); }
.trilho i.carregando { width: 40%; animation: carrega 1.2s ease-in-out infinite; }
@keyframes carrega { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
@media (prefers-reduced-motion: reduce) { .trilho i.carregando { animation: none; width: 100%; opacity: .5; } }
.tag-dobro { color: var(--bg); background: var(--gold); border-radius: 6px; padding: 1px 6px; margin-left: 4px; letter-spacing: 0; }
.modos { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.modos button { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px 14px; text-align: left; }
.modos small { font-weight: 500; font-size: 12px; color: var(--muted); }
.modos button[data-modo="dobro"][aria-pressed="true"] { border-color: var(--prata-cor); background: color-mix(in srgb, var(--prata-cor) 24%, transparent); }
.tag-dobro.t2 { background: var(--prata); color: var(--prata-fg); }
.modos button[data-modo="triplo"][aria-pressed="true"] { border-color: var(--triplo); background: color-mix(in srgb, var(--triplo) 16%, transparent); }
.tag-dobro.t3 { background: var(--triplo); color: var(--triplo-fg); }
.seg.pequeno { display: flex; gap: 6px; }
.seg.pequeno button { padding: 4px 12px; font-size: 12px; border-radius: 999px; }
.status-cat { display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.status-cat.ok { padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--ok) 14%, transparent); }
.minha { display: flex; align-items: center; gap: 8px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.minha .txt { flex: 1; min-width: 0; }
.minha .txt strong, .minha .txt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.minha .btn.mini { padding: 7px 10px; font-size: 13px; border-radius: 10px; }
.btn.perigo { color: var(--bad); }
.minha .txt strong { display: block; }
.minha .txt span { display: block; color: var(--muted); font-size: 12px; }
.link[disabled] { opacity: .45; cursor: not-allowed; }
.caixa.extras { gap: 10px; padding: 14px; }
.divisor { border-top: 1px solid var(--line); }
.tag-cat { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold); font-weight: 700; }

/* Nível subindo */
@keyframes sobe { 0% { transform: none; } 35% { transform: translateY(-5px) scale(1.45); color: var(--ok); } 100% { transform: none; } }
@keyframes brilho { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--gold) 60%, transparent); } 100% { box-shadow: 0 0 0 12px transparent; } }
@keyframes mais1 { 0% { opacity: 0; transform: translate(-50%, 0) scale(0.7); } 20% { opacity: 1; transform: translate(-50%, -6px) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -34px) scale(1); } }
.chip-nivel.sobe { animation: brilho .7s ease-out; }
.chip-nivel.sobe strong { display: inline-block; animation: sobe .6s cubic-bezier(.3,1.6,.5,1); }
.mais1 { position: absolute; left: 50%; top: -4px; font-family: var(--f-mono); font-weight: 700; font-size: 15px; color: var(--ok); pointer-events: none; animation: mais1 .9s ease-out forwards; }
@media (prefers-reduced-motion: reduce) { .chip-nivel.sobe, .chip-nivel.sobe strong, .mais1 { animation: none; } .mais1 { display: none; } }

@keyframes entra { from { opacity: 0.4; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.entra { animation: entra .25s ease-out; }
.placar-desafio { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
.placar-desafio div { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.placar-desafio b { font-family: var(--f-mono); font-size: 40px; line-height: 1; color: var(--gold); }

// ---------- Estado ----------
const CHAVE = "mente.estado.v1";
const PADRAO = () => ({
  v: 1, perfil: null, nivel: 0, respondidas: 0, porCat: {}, vistas: {},
  curtidos: [], passados: [], matches: [], novos: [], chats: {}, passes: [],

let db = null, uid = null, salvarTimer = null;

function carregarLocal() {
  try { const t = localStorage.getItem(CHAVE); return t ? Object.assign(PADRAO(), JSON.parse(t)) : null; } catch { return null; }
}
function salvar() {

  try { localStorage.setItem(CHAVE, JSON.stringify(S)); } catch {}
  clearTimeout(salvarTimer);
  salvarTimer = setTimeout(salvarNuvem, 800);

}

async function salvarNuvem() {
  if (!db || !uid) return;
  if (gravando) { pendente = true; return; }
  gravando = true;
  try { await db.doc("data/users/" + uid + "/estado").set(JSON.parse(JSON.stringify(S))); } catch (e) { if (e && e.code === "invalid_argument") db = null; }
  gravando = false;
  if (pendente) { pendente = false; salvarNuvem(); }
}
async function conectarNuvem() {
  try {
    if (!window.claude || !window.claude.use) return;
    const user = await window.claude.use("user");
    uid = user ? await user.id() : null;
    if (!uid) return;
    db = await window.claude.use("db");
    if (!db) return;
    const snap = await db.doc("data/users/" + uid + "/estado").get();
    const remoto = snap.exists ? snap.data() : null;
    if (remoto && (remoto.atualizado || 0) > (S.atualizado || 0)) {
      S = Object.assign(PADRAO(), JSON.parse(JSON.stringify(remoto)));
      try { localStorage.setItem(CHAVE, JSON.stringify(S)); } catch {}
      if (!rodada) render();
    } else if (S.perfil) {
      salvarNuvem();
    }

}

// ---------- Utilidades ----------
const $ = s => document.querySelector(s);
const tela = $("#tela");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const arred = n => Math.round(n * 10) / 10;
const fmtNivel = n => Number(n).toLocaleString("pt-BR", { maximumFractionDigits: 1 });
const brl = v => "R$ " + Number(v).toLocaleString("pt-BR");
const embaralhar = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const iniciais = n => n.split(" ").map(x => x[0]).slice(0, 2).join("").toUpperCase();
function hash(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
function fundo(p) { return `linear-gradient(150deg, hsl(${p.hue} 45% 38%), hsl(${(p.hue + 40) % 360} 50% 22%))`; }
function avatarHTML(p, tam) {
  const eu = p === "eu";
  const foto = eu ? S.perfil.foto : null;
  const nome = eu ? S.perfil.nome : p.nome;
  const bg = foto ? `background-image:url(${foto})` : `background:${eu ? "linear-gradient(150deg, var(--accent), #4a1022)" : fundo(p)}`;
  return `<div class="avatar" style="width:${tam}px;height:${tam}px;font-size:${Math.round(tam * 0.42)}px;${bg}">${foto ? "" : esc(iniciais(nome))}</div>`;
}
function toast(txt) {
  const t = document.createElement("div"); t.className = "toast entra"; t.textContent = txt;
  document.body.appendChild(t); setTimeout(() => t.remove(), 1800);
}
function animarNivel(qtd = 1) {
  const chip = $("#chipNivel");

  chip.appendChild(m); setTimeout(() => m.remove(), 950);
}
function folha(html) {
  const v = document.createElement("div"); v.className = "veu";
  v.innerHTML = `<div class="folha entra" role="dialog" aria-modal="true">${html}</div>`;
  v.addEventListener("click", e => { if (e.target === v) v.remove(); });
  document.body.appendChild(v); return v;
}
function interesseOk(p) { const i = S.perfil.interesse; return i === "T" || i === p.sexo; }
function desbloqueado(p) { return p.nivel <= S.nivel || S.passes.includes(p.id); }

// ---------- Filtros: nível, visibilidade e distância ----------
const CIDADES = {
  "Belo Horizonte": [-19.9167, -43.9345], "Brasília": [-15.7939, -47.8828], "Campinas": [-22.9099, -47.0626],
  "Curitiba": [-25.4284, -49.2733], "Florianópolis": [-27.5954, -48.548], "Goiânia": [-16.6869, -49.2648],
  "Manaus": [-3.119, -60.0217], "Natal": [-5.7945, -35.211], "Porto Alegre": [-30.0346, -51.2177],
  "Recife": [-8.0476, -34.877], "Rio de Janeiro": [-22.9068, -43.1729], "Salvador": [-12.9777, -38.5016],
  "São Carlos": [-22.0175, -47.8909], "São José dos Campos": [-23.1896, -45.8841], "São Paulo": [-23.5505, -46.6333],
  "Vitória": [-20.3155, -40.3128]
};
const semAcento = t => String(t || "").normalize("NFD").replace(/\p{M}/gu, "").toLowerCase().trim();
const COORD = Object.fromEntries(Object.entries(CIDADES).map(([n, c]) => [semAcento(n), c]));
const RAIOS = [5, 10, 25, 50, 100, 250, 500, null];
function meuLocal() {
  if (S.local) return S.local;
  const c = S.perfil && COORD[semAcento(S.perfil.cidade)];
  return c ? { lat: c[0], lng: c[1], nome: S.perfil.cidade } : null;
}
// Perfis fictícios ficam espalhados entre 2 e 19 km do centro da cidade, sempre no mesmo ponto.
function posPerfil(p) {
  const [la, lo] = CIDADES[p.cidade], h = hash(p.id), km = 2 + h % 18, ang = (h % 360) * Math.PI / 180;
  return { lat: la + km / 111 * Math.sin(ang), lng: lo + km / (111 * Math.cos(la * Math.PI / 180)) * Math.cos(ang) };
}
function distanciaKm(p) {
  const a = meuLocal(); if (!a) return null;
  const b = posPerfil(p), r = Math.PI / 180;
  const x = Math.sin((b.lat - a.lat) * r / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin((b.lng - a.lng) * r / 2) ** 2;
  return Math.round(12742 * Math.asin(Math.sqrt(x)));
}
// A faixa de nível vai do mínimo escolhido até o seu nível; perfis acima continuam aparecendo borrados.
// Fora do raio o perfil não aparece. Com raio definido e sem localização, nada passa.
function noFiltro(p) {
  const f = S.filtros;
  if (p.nivel <= S.nivel && p.nivel < Math.min(f.verMin, S.nivel)) return false;
  if (f.raio == null) return true;
  const d = distanciaKm(p);
  return d != null && d <= f.raio;
}
const elegivel = p => noFiltro(p) && interesseOk(p);
const semMatch = () => !!S.perfil && S.perfil.interesse === "N";
// Quem está abaixo do nível mínimo de visibilidade não vê você, então não dá match. Do seu nível para cima, todos veem.
function meVe(p) { return p.nivel >= Math.min(S.filtros.visMin, S.nivel); }
function resumoFiltros() {
  const f = S.filtros;
  return `Níveis ${Math.min(f.verMin, Math.floor(S.nivel))} a ${fmtNivel(S.nivel)} · ${f.raio ? "até " + f.raio + " km" : "qualquer distância"}`;
}
function abrirFiltros() {
  const f = S.filtros, loc = meuLocal();
  const iR = RAIOS.includes(f.raio) ? RAIOS.indexOf(f.raio) : RAIOS.length - 1;
  const txtR = r => r ? "até " + r + " km" : "qualquer distância";
  const campoNivel = (id, valor, antes, depois) => `<div class="linha" style="flex-wrap:nowrap"><span class="muted">${antes}</span><input id="${id}" type="number" inputmode="numeric" min="0" max="${Math.floor(S.nivel)}" value="${Math.min(valor, Math.floor(S.nivel))}" style="max-width:90px"><span class="muted">${depois}</span></div>`;
  const v = folha(`<span class="rotulo">Filtros</span><h2>Quem você vê e quem vê você</h2>
    <div class="campo"><label for="fVer">Perfis que você vê</label>${campoNivel("fVer", f.verMin, "Do nível", `até o seu, ${fmtNivel(S.nivel)}`)}
      <span class="muted" style="font-size:13px">Perfis acima do seu nível continuam aparecendo borrados.</span></div>
    <div class="campo"><label for="fVis">Quem pode ver seu perfil</label>${campoNivel("fVis", f.visMin, "Pessoas a partir do nível", "")}
      <span class="muted" style="font-size:13px">Use para esconder seu perfil de quem está muitos níveis abaixo de você.</span></div>
    <div class="campo"><label for="fRaio">Distância: <b id="raioTxt">${txtR(RAIOS[iR])}</b></label>
      <input id="fRaio" type="range" min="0" max="${RAIOS.length - 1}" step="1" value="${iR}" ${loc ? "" : "disabled"}>
      <span class="muted" style="font-size:13px" id="locTxt">${loc ? "A partir de " + esc(loc.nome) : "Para filtrar por distância, informe sua cidade no perfil ou use sua localização."}</span>
      <button class="link" type="button" id="usarLoc" style="align-self:flex-start;padding:4px 0">Usar minha localização atual</button></div>
    <div class="erro" id="filtroErro"></div>
    <button class="btn bloco" type="button" id="salvarF">Salvar filtros</button>
    <button class="link" type="button" id="cancelarF">Cancelar</button>`);
  const raio = v.querySelector("#fRaio"), locTxt = v.querySelector("#locTxt");
  raio.addEventListener("input", () => { v.querySelector("#raioTxt").textContent = txtR(RAIOS[raio.value]); });
  v.querySelector("#usarLoc").addEventListener("click", () => {
    if (!navigator.geolocation) { locTxt.textContent = "Este navegador não informa a localização."; return; }
    locTxt.textContent = "Buscando sua localização…";
    navigator.geolocation.getCurrentPosition(pos => {
      S.local = { lat: pos.coords.latitude, lng: pos.coords.longitude, nome: "sua localização atual" }; salvar();
      locTxt.textContent = "A partir de sua localização atual"; raio.disabled = false;
    }, () => { locTxt.textContent = "Não foi possível pegar sua localização. Verifique a permissão do navegador."; }, { timeout: 10000 });
  });
  v.querySelector("#cancelarF").addEventListener("click", () => v.remove());
  v.querySelector("#salvarF").addEventListener("click", () => {
    const num = id => { const x = v.querySelector(id).value.trim(); return x === "" ? 0 : Math.round(Number(x)); };
    const verMin = num("#fVer"), visMin = num("#fVis");

    const pg = c && Number.isInteger(i) && (banco ? (banco[cid] || [])[i] : c.q[i]);

    const fila = resolverDesafio({ m: mult, f: textoCurto(d.f, 40), q: d.q.slice(0, 40) });

const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";

}

const LIMITE_TEXTO = 40000;
async function textoDoPdf(f) {
  const lib = await pdfjs();
  const doc = await lib.getDocument({ data: new Uint8Array(await f.arrayBuffer()) }).promise;
  let t = "";
  for (let p = 1; p <= Math.min(doc.numPages, 80) && t.length < LIMITE_TEXTO; p++) {
    const pg = await doc.getPage(p);

async function lerArquivos(lista) {

    return { nome: imgs.length === 1 ? imgs[0].name : imgs.length + " fotos", imagens: imgs.slice(0, maxImagens), texto: "" };
  }
  const f = fs.find(x => !x.type.startsWith("image/"));

  if (f.type === "application/pdf" || /\.pdf$/i.test(f.name)) {
    try { texto = await textoDoPdf(f); } catch { throw new Error("Não consegui abrir esse PDF."); }
    if (texto.replace(/\s/g, "").length < 200) throw new Error("Esse PDF parece ser só imagem. Tire fotos das páginas e envie as fotos.");
  } else if (/\.(docx?|xlsx?|pptx?)$/i.test(f.name)) {

function imagemBase64(f) {
  return new Promise((ok, falha) => {
    const url = URL.createObjectURL(f), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1568 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL("image/jpeg", 0.85).split(",")[1]);

async function perguntasDoServidor(fonte, mult, evitar, signal) {

  if (c === "rede") return "Sem conexão com o servidor. Verifique a internet e tente de novo.";
  if (c === "codigo") return "Código de acesso inválido.";
  if (c === "not_granted" || c === "sampling_disabled" || c === "not_declared" || c === "capability_disabled" || c === "capability_removed") return "O uso do Claude não foi permitido nesta página.";
  if (c === "rate_limited") return "Muitos pedidos agora. Tente de novo em alguns minutos.";

  if (c === "prompt_too_large") return "O arquivo é grande demais. Tente um trecho menor.";
  if (c === "image_rejected" || c === "images_unavailable") return "Não consegui usar essas fotos. Tente outras ou envie um PDF.";

async function gravarAudio() {

  const rec = new MediaRecorder(stream, Object.assign({ audioBitsPerSecond: 24000 }, tipo ? { mimeType: tipo } : {}));
  const g = gravacao = { alvo: chatAberto, rec, stream, partes: [], inicio: Date.now(), cancelado: false, timer: 0 };
  rec.ondataavailable = e => { if (e.data.size) g.partes.push(e.data); };

    const rd = new FileReader();

    e.preventDefault(); if (!botao || botao.disabled) return;
    const val = id => { const x = $("#" + id); return x ? x.value : ""; };
    if ((t === "criar" || t === "redefinir") && val("cSenha") !== val("cSenha2")) { erro.textContent = "As senhas não são iguais."; return; }
    const texto = botao.textContent; botao.disabled = true; botao.textContent = "Aguarde…"; erro.textContent = "";
    try {
      if (t === "criar") aplicarConta(await chamarConta({ acao: "cadastrar", usuario: val("cUsuario").trim(), email: val("cEmail").trim(), senha: val("cSenha"), estado: S }));
      else if (t === "entrar") aplicarConta(await chamarConta({ acao: "entrar", login: val("cLogin").trim(), senha: val("cSenha") }));
      else if (t === "redefinir") { aplicarConta(await chamarConta({ acao: "redefinir", token: tokenRedefinir, senha: val("cSenha") })); tokenRedefinir = null; toast("Senha alterada"); }
      else if (t === "recuperar") { await chamarConta({ acao: "recuperar", email: val("cEmail").trim() }); toast("Se o e-mail tiver conta, o link foi enviado"); telaConta = "entrar"; return render(); }
      telaConta = "entrar"; render();
    } catch (x) { erro.textContent = x.erro; botao.disabled = false; botao.textContent = texto; }
  });
  montarSocial();
}
function renderEscolherUsuario() {
  $("#abas").hidden = true; $("#chipNivel").hidden = true;
  tela.innerHTML = `
  <form class="pilha entra" id="fUsuario" novalidate style="padding-top:8px">
    <h1>Escolha seu nome de usuário</h1>
    <p class="muted" style="margin:0">É como você entra e aparece no Mente. Ele é único.</p>
    <div class="campo"><label for="cUsuario">Usuário</label><input id="cUsuario" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20"></div>
    <span class="muted" style="font-size:12px;margin-top:-10px">De 3 a 20 caracteres: letras minúsculas, números, ponto ou _.</span>

    <button class="btn bloco" type="submit">Continuar</button>
    <button class="link" type="button" id="sairU">Sair</button>

  const u = $("#cUsuario"); u.addEventListener("input", () => { u.value = u.value.toLowerCase().replace(/\s/g, ""); });

    e.preventDefault();
    try { conta = (await chamarConta({ acao: "definirUsuario", usuario: u.value.trim() })).conta; render(); }
    catch (x) { $("#contaErro").textContent = x.erro; }
  });
}

// ---------- Perfil ----------
function renderPerfil() {
  const pf = S.perfil;
  const acertos = Object.values(S.porCat).reduce((s, c) => s + c.a, 0);
  const pct = S.respondidas ? Math.round(acertos / S.respondidas * 100) : 0;
  const melhor = Object.entries(S.porCat).filter(([, c]) => c.r >= 5).sort((a, b) => b[1].a / b[1].r - a[1].a / a[1].r)[0];
  const melhorNome = melhor ? CATS.find(c => c.id === melhor[0]).nome : "—";
  tela.innerHTML = `
  <div class="pilha entra">
    <div class="linha" style="gap:14px;flex-wrap:nowrap">${avatarHTML("eu", 76)}<div style="min-width:0"><h2>${esc(pf.nome)}, ${pf.idade}</h2><div class="muted">${esc(pf.cidade || "Complete seu perfil")}</div></div></div>
    ${pf.bio ? `<p style="margin:0">${esc(pf.bio)}</p>` : ""}
    <div class="stats">
      <div class="stat"><b style="color:var(--gold)">${fmtNivel(S.nivel)}</b><span>nível</span></div>
      <div class="stat"><b>${S.respondidas}</b><span>respondidas</span></div>
      <div class="stat"><b>${pct}%</b><span>de acerto</span></div>
    </div>
    <div class="caixa"><div class="chave"><div><strong>Melhor categoria</strong><div class="muted" style="font-size:13px">Com pelo menos 5 respostas</div></div><b>${esc(melhorNome)}</b></div></div>
    <div class="caixa">
      <div><strong>Quero conhecer</strong><div class="muted" style="font-size:13px">${semMatch() ? "Você está invisível e o match está desligado." : "Escolha \"Ninguém\" para ficar invisível e pausar o match."}</div></div>
      <div class="seg quatro" id="pInteresse">${[["F", "Mulheres"], ["M", "Homens"], ["T", "Ambos"], ["N", "Ninguém"]].map(([v, t]) => `<button type="button" data-v="${v}" aria-pressed="${pf.interesse === v}">${t}</button>`).join("")}</div>
    </div>
    <div class="caixa"><div class="chave"><div><strong>Filtros</strong><div class="muted" style="font-size:13px">${resumoFiltros()}</div></div><button class="btn sec" type="button" id="pFiltros" style="padding:8px 14px">Ajustar</button></div></div>
    <div class="caixa">
      <div class="chave"><div><strong>Meu Passe Direto</strong><div class="muted" style="font-size:13px">Quem ainda não chegou no seu nível pode furar a fila e aparecer pra você.</div></div>
        <button class="toggle" type="button" role="switch" id="tPasse" aria-checked="${S.meuPasse.ativo}" aria-label="Aceitar Passe Direto"></button></div>
      <div class="campo" ${S.meuPasse.ativo ? "" : "hidden"} id="cPasse"><label for="vPasse">Valor (R$)</label><input id="vPasse" type="number" inputmode="numeric" min="10" step="10" value="${S.meuPasse.valor}"></div>
    </div>
    <div class="caixa"><div class="chave"><div><strong>Matches</strong><div class="muted" style="font-size:13px">${S.curtidos.length} curtidas enviadas · ${S.passes.length} passes usados</div></div><b style="font-family:var(--f-mono)">${S.matches.length}</b></div></div>
    ${conta ? `<div class="caixa"><div class="chave"><div style="min-width:0"><strong>@${esc(conta.usuario)}</strong><div class="muted" style="font-size:13px">${esc(conta.email || (conta.google ? "Conta Google" : conta.apple ? "Conta Apple" : ""))}</div></div><button class="btn sec mini" type="button" id="sairConta">Sair</button></div></div>` : ""}
    <button class="btn sec bloco" type="button" id="editar">Editar perfil</button>
    <button class="link" type="button" id="zerar">Recomeçar do zero</button>
  </div>`;
  $("#pInteresse").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b || b.dataset.v === pf.interesse) return;
    pf.interesse = b.dataset.v; salvar(); toast(b.dataset.v === "N" ? "Match desligado" : "Match ativado"); render();
  });
  $("#pFiltros").addEventListener("click", abrirFiltros);
  $("#tPasse").addEventListener("click", () => { S.meuPasse.ativo = !S.meuPasse.ativo; salvar(); render(); });
  const vp = $("#vPasse"); if (vp) vp.addEventListener("change", () => { const n = Math.max(10, Math.round(Number(vp.value) || 0)); S.meuPasse.valor = n; vp.value = n; salvar(); toast("Valor salvo"); });
  $("#editar").addEventListener("click", () => renderCadastro(true));
  const sc = $("#sairConta"); if (sc) sc.addEventListener("click", sairDaConta);
  $("#zerar").addEventListener("click", () => {
    const v = folha(`<h2>Recomeçar do zero?</h2><p class="muted" style="margin:0">Seu nível, matches e conversas serão apagados. Isso não pode ser desfeito.</p>
      <button class="btn bloco" type="button" id="sim" style="background:var(--bad)">Apagar e recomeçar</button><button class="link" type="button" id="nao">Cancelar</button>`);
    v.querySelector("#nao").addEventListener("click", () => v.remove());
    v.querySelector("#sim").addEventListener("click", () => { v.remove(); S = PADRAO(); rascunho = { nome: "", idade: "", sexo: "", interesse: "", cidade: "", bio: "", foto: null }; pulados.clear(); selecao = null; salvar(); aba = "quiz"; render(); });
  });
}
